name: Weekly Market Report

on:
  schedule:
    # Friday 20:05 UTC = Friday 16:05 ET during EDT
    # Friday 21:05 UTC = Friday 16:05 ET during EST
    - cron: "5 20 * * 5"
    - cron: "5 21 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check New York schedule window
        id: ny_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ny_day="$(TZ=America/New_York date +%u)"
          ny_hour="$(TZ=America/New_York date +%H)"
          ny_minute="$(TZ=America/New_York date +%M)"

          # GitHub's scheduled workflows can start several minutes late.
          # Accept any run that lands during the 16:00 ET hour on Friday.
          if [ "$ny_day" = "5" ] && [ "$ny_hour" = "16" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping run outside Friday 16:00-16:59 ET (got day=$ny_day hour=$ny_hour minute=$ny_minute)"
          fi

      - name: Checkout
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.ny_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Generate weekly report
        if: steps.ny_gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: "1"
        run: python -m auto_report.auto_weekly_report

      - name: Upload outputs
        if: always() && steps.ny_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: weekly-report-${{ github.run_id }}
          path: auto_report/outputs/
          retention-days: 90

name: Weekly Market Report

on:
  schedule:
    # Friday 20:05 UTC = Friday 16:05 ET during EDT
    # Friday 21:05 UTC = Friday 16:05 ET during EST
    - cron: "5 20 * * 5"
    - cron: "5 21 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check New York schedule window
        id: ny_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ny_day="$(TZ=America/New_York date +%u)"
          ny_hour="$(TZ=America/New_York date +%H)"
          ny_minute="$(TZ=America/New_York date +%M)"

          # GitHub's scheduled workflows can start several minutes late.
          # Accept any run that lands during the 16:00 ET hour on Friday.
          if [ "$ny_day" = "5" ] && [ "$ny_hour" = "16" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping run outside Friday 16:00-16:59 ET (got day=$ny_day hour=$ny_hour minute=$ny_minute)"
          fi

      - name: Checkout
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.ny_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt -c requirements-lock.txt

      - name: Fetch portfolio state from app
        if: steps.ny_gate.outputs.should_run == 'true'
        env:
          TALISMAN_API_URL: ${{ vars.TALISMAN_API_URL }}
          API_PROXY_SECRET: ${{ secrets.API_PROXY_SECRET }}
          TALISMAN_API_PASSWORD: ${{ secrets.TALISMAN_API_PASSWORD }}
        run: python -m auto_report.fetch_state

      - name: Generate weekly report
        if: steps.ny_gate.outputs.should_run == 'true'
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL_LOW: ${{ vars.ANTHROPIC_MODEL_LOW }}
          ANTHROPIC_MODEL_MID: ${{ vars.ANTHROPIC_MODEL_MID }}
          ANTHROPIC_MODEL_HIGH: ${{ vars.ANTHROPIC_MODEL_HIGH }}
          OPENAI_MODEL_LOW: ${{ vars.OPENAI_MODEL_LOW }}
          OPENAI_MODEL_MID: ${{ vars.OPENAI_MODEL_MID }}
          OPENAI_MODEL_HIGH: ${{ vars.OPENAI_MODEL_HIGH }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: "1"
          AUTO_REPORT_API_ONLY: "1"
          AUTO_REPORT_SKIP_LOCAL_PERSISTENCE: "1"
        run: python -m auto_report.auto_weekly_report

      - name: Upload outputs
        if: always() && steps.ny_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: weekly-report-${{ github.run_id }}
          path: auto_report/outputs/
          retention-days: 90

      - name: Sync report state to app
        if: steps.ny_gate.outputs.should_run == 'true' && success()
        env:
          TALISMAN_API_URL: ${{ vars.TALISMAN_API_URL }}
          REPORT_SYNC_SECRET: ${{ secrets.REPORT_SYNC_SECRET }}
          API_PROXY_SECRET: ${{ secrets.API_PROXY_SECRET }}
        run: python -m auto_report.sync_report_state weekly

name: Daily Portfolio Risk Report

on:
  schedule:
    # Weekdays 13:15 UTC = 09:15 ET during EDT
    # Weekdays 14:15 UTC = 09:15 ET during EST
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check New York schedule window
        id: ny_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ny_day="$(TZ=America/New_York date +%u)"
          ny_hour="$(TZ=America/New_York date +%H)"
          ny_minute="$(TZ=America/New_York date +%M)"

          if [ "$ny_day" -ge 1 ] && [ "$ny_day" -le 5 ] && [ "$ny_hour" = "09" ] && [ "$ny_minute" = "15" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping run outside weekday 09:15 ET (got day=$ny_day hour=$ny_hour minute=$ny_minute)"
          fi

      - name: Checkout
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.ny_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Decode open_positions.csv from secret
        if: steps.ny_gate.outputs.should_run == 'true'
        env:
          OPEN_POSITIONS_B64: ${{ secrets.OPEN_POSITIONS_B64 }}
        run: |
          if [ -n "$OPEN_POSITIONS_B64" ]; then
            echo "$OPEN_POSITIONS_B64" | base64 --decode > portfolio/open_positions.csv
            echo "Decoded open_positions.csv ($(wc -l < portfolio/open_positions.csv) lines)"
          else
            echo "OPEN_POSITIONS_B64 secret not set — running without open positions"
          fi

      - name: Generate daily report
        if: steps.ny_gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: "1"
        run: python auto_report/auto_daily_report.py

      - name: Upload outputs
        if: always() && steps.ny_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-report-${{ github.run_id }}
          path: auto_report/outputs/daily/
          retention-days: 90

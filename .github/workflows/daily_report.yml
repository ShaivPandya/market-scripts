name: Daily Portfolio Risk Report

on:
  schedule:
    # Monday-Saturday 13:07 UTC = 09:07 ET during EDT; wait in-job until 09:45 ET
    # Monday-Saturday 14:07 UTC = 09:07 ET during EST; wait in-job until 09:45 ET
    - cron: "7 13 * * 1-6"
    - cron: "7 14 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check New York schedule window
        id: ny_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ny_day="$(TZ=America/New_York date +%u)"
          ny_hour="$(TZ=America/New_York date +%H)"
          ny_minute="$(TZ=America/New_York date +%M)"
          ny_offset="$(TZ=America/New_York date +%z)"

          ny_total_minutes=$((10#$ny_hour * 60 + 10#$ny_minute))
          window_start=$((9 * 60 + 7))
          window_end=$((10 * 60 + 59))

          correct_dst_cron=false
          if [ "$EVENT_SCHEDULE" = "7 13 * * 1-6" ] && [ "$ny_offset" = "-0400" ]; then
            correct_dst_cron=true
          elif [ "$EVENT_SCHEDULE" = "7 14 * * 1-6" ] && [ "$ny_offset" = "-0500" ]; then
            correct_dst_cron=true
          fi

          # GitHub's scheduled workflows can start late. Enqueue early, then wait
          # immediately before report generation if GitHub starts the runner promptly.
          # Use the triggering cron plus NY UTC offset to reject the opposite-DST cron.
          if [ "$correct_dst_cron" = "true" ] && [ "$ny_day" -ge 1 ] && [ "$ny_day" -le 6 ] && [ "$ny_total_minutes" -ge "$window_start" ] && [ "$ny_total_minutes" -le "$window_end" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping run outside Monday-Saturday 09:07-10:59 ET for the active DST cron (got schedule=$EVENT_SCHEDULE offset=$ny_offset day=$ny_day hour=$ny_hour minute=$ny_minute)"
          fi

      - name: Checkout
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.ny_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt -c requirements-lock.txt

      - name: Wait until 09:45 ET
        if: steps.ny_gate.outputs.should_run == 'true'
        run: |
          ny_hour="$(TZ=America/New_York date +%H)"
          ny_minute="$(TZ=America/New_York date +%M)"
          ny_second="$(TZ=America/New_York date +%S)"

          ny_total_seconds=$((10#$ny_hour * 3600 + 10#$ny_minute * 60 + 10#$ny_second))
          target_seconds=$((9 * 3600 + 45 * 60))

          if [ "$ny_total_seconds" -lt "$target_seconds" ]; then
            sleep_seconds=$((target_seconds - ny_total_seconds))
            echo "Waiting $sleep_seconds seconds until 09:45 ET"
            sleep "$sleep_seconds"
          fi

      - name: Fetch portfolio state from app
        if: steps.ny_gate.outputs.should_run == 'true'
        env:
          TALISMAN_API_URL: ${{ vars.TALISMAN_API_URL }}
          API_PROXY_SECRET: ${{ secrets.API_PROXY_SECRET }}
          TALISMAN_API_PASSWORD: ${{ secrets.TALISMAN_API_PASSWORD }}
        run: python -m auto_report.fetch_state

      - name: Generate daily report
        if: steps.ny_gate.outputs.should_run == 'true'
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL_LOW: ${{ vars.ANTHROPIC_MODEL_LOW }}
          ANTHROPIC_MODEL_MID: ${{ vars.ANTHROPIC_MODEL_MID }}
          ANTHROPIC_MODEL_HIGH: ${{ vars.ANTHROPIC_MODEL_HIGH }}
          OPENAI_MODEL_LOW: ${{ vars.OPENAI_MODEL_LOW }}
          OPENAI_MODEL_MID: ${{ vars.OPENAI_MODEL_MID }}
          OPENAI_MODEL_HIGH: ${{ vars.OPENAI_MODEL_HIGH }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: "1"
        run: python -m auto_report.auto_daily_report

      - name: Upload outputs
        if: always() && steps.ny_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-report-${{ github.run_id }}
          path: auto_report/outputs/daily/
          retention-days: 90

      - name: Sync report state to app
        if: steps.ny_gate.outputs.should_run == 'true' && success()
        env:
          TALISMAN_API_URL: ${{ vars.TALISMAN_API_URL }}
          REPORT_SYNC_SECRET: ${{ secrets.REPORT_SYNC_SECRET }}
          API_PROXY_SECRET: ${{ secrets.API_PROXY_SECRET }}
        run: python -m auto_report.sync_report_state daily

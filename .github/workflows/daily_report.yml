name: Daily Portfolio Risk Report

on:
  schedule:
    # Weekdays at 13:15 UTC = 09:15 ET (EDT, Mar–Nov)
    # Weekdays at 14:15 UTC = 09:15 ET (EST, Nov–Mar)
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode open_positions.csv from secret
        env:
          OPEN_POSITIONS_B64: ${{ secrets.OPEN_POSITIONS_B64 }}
        run: |
          if [ -n "$OPEN_POSITIONS_B64" ]; then
            echo "$OPEN_POSITIONS_B64" | base64 --decode > portfolio/open_positions.csv
            echo "Decoded open_positions.csv ($(wc -l < portfolio/open_positions.csv) lines)"
          else
            echo "OPEN_POSITIONS_B64 secret not set — running without open positions"
          fi

      - name: Generate daily report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: "1"
        run: python auto_report/auto_daily_report.py

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-report-${{ github.run_id }}
          path: auto_report/outputs/daily/
          retention-days: 90

name: Daily Portfolio Risk Report

on:
  schedule:
    # Weekdays 13:45 UTC = 09:45 ET during EDT
    # Weekdays 14:45 UTC = 09:45 ET during EST
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check New York schedule window
        id: ny_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ny_day="$(TZ=America/New_York date +%u)"
          ny_hour="$(TZ=America/New_York date +%H)"
          ny_minute="$(TZ=America/New_York date +%M)"

          ny_total_minutes=$((10#$ny_hour * 60 + 10#$ny_minute))
          window_start=$((9 * 60 + 45))
          window_end=$((10 * 60 + 30))

          # GitHub's scheduled workflows can start late. Accept the intended
          # 09:45 ET run through 10:30 ET, but reject the opposite-DST cron.
          if [ "$ny_day" -ge 1 ] && [ "$ny_day" -le 5 ] && [ "$ny_total_minutes" -ge "$window_start" ] && [ "$ny_total_minutes" -le "$window_end" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping run outside weekday 09:45-10:30 ET (got day=$ny_day hour=$ny_hour minute=$ny_minute)"
          fi

      - name: Checkout
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.ny_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.ny_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Generate daily report
        if: steps.ny_gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: "1"
        run: python -m auto_report.auto_daily_report

      - name: Upload outputs
        if: always() && steps.ny_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-report-${{ github.run_id }}
          path: auto_report/outputs/daily/
          retention-days: 90

[project]
name = "market-scripts"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:`resume_download` is deprecated and will be removed in version 1\\.0\\.0\\.:FutureWarning:huggingface_hub\\.file_download",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E402",   # module level import not at top — some lazy imports remain
    "F401",   # imported but unused — some re-exports are intentional
]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "auto_report",
    "backtest",
    "commodities",
    "equities",
    "fx",
    "government_bonds",
    "macro",
    "ontology",
    "portfolio",
    "utils",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
